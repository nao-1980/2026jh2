<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6FDB">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>5教科ノート 中2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: 1画面1問のシール手帳。上にログフィルム、下に大きな答えボタン */
:root{
  --bg:#F2F6FD; --dot:#D6E2F6; --card:#FFFFFF; --line:#D0DDF2; --shadow:#BACDEE;
  --ink:#22304A; --sub:#66758F; --pink:#2F6FDB; --pinkL:#DEEAFB; --lav:#1E8CA8; --lavL:#DDF1F6;
  --ok:#22A884; --okL:#DDF5EE; --ng:#E8536E; --ngL:#FDE3E8; --memo:#FFF9E8; --memoLine:#E9C97A;
  --btnEdge:#22304A; --gray:#CFD7E6;
  --fKoku:#6C9EF0; --fMath:#B49BFF; --fEng:#FF9DBB; --fSci:#5ED3A8; --fSoc:#FFC75A; --faceInk:#22304A;
  --head:"Mochiy Pop One","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121A2B; --dot:#1D2940; --card:#1B2539; --line:#2E3D5C; --shadow:#0A0F1A;
  --ink:#E8EEF9; --sub:#A3B1CC; --pink:#3F7FE6; --pinkL:#1E3360; --lav:#3BB0CC; --lavL:#173845;
  --ok:#4FD1A9; --okL:#173A31; --ng:#FF7C93; --ngL:#45222B; --memo:#3A3122; --memoLine:#8C7440;
  --btnEdge:#070B14; --gray:#3A4660; --fKoku:#5A8BE0; --fMath:#9A80F2; --fEng:#E883A3; --fSci:#3FBB8F; --fSoc:#E9AD45; --faceInk:#141C2E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A2B; --dot:#1D2940; --card:#1B2539; --line:#2E3D5C; --shadow:#0A0F1A;
  --ink:#E8EEF9; --sub:#A3B1CC; --pink:#3F7FE6; --pinkL:#1E3360; --lav:#3BB0CC; --lavL:#173845;
  --ok:#4FD1A9; --okL:#173A31; --ng:#FF7C93; --ngL:#45222B; --memo:#3A3122; --memoLine:#8C7440;
  --btnEdge:#070B14; --gray:#3A4660; --fKoku:#5A8BE0; --fMath:#9A80F2; --fEng:#E883A3; --fSci:#3FBB8F; --fSoc:#E9AD45; --faceInk:#141C2E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:22px 22px;
  color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.7;font-weight:700;padding-inline:16px;padding-block:12px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--head);font-weight:400;margin:0;text-wrap:balance;line-height:1.35}
h1{font-size:1.6rem}h2{font-size:1.3rem}h3{font-size:1.1rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{font:inherit;font-weight:800;color:var(--ink);background:var(--card);border:2.5px solid var(--btnEdge);border-radius:999px;
  box-shadow:0 5px 0 var(--btnEdge);padding:12px 18px;cursor:pointer;transition:transform .08s,box-shadow .08s;min-height:52px;font-size:1.05rem}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btnEdge)}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--lav);outline-offset:3px}
.btn.main{background:var(--pink);color:#fff}
.btn.lav{background:var(--lav);color:#fff}
.btn.small{min-height:40px;padding:6px 14px;font-size:.9rem;box-shadow:0 3px 0 var(--btnEdge)}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;border-radius:999px;padding:2px 12px;font-size:.8rem;background:var(--lavL);color:var(--lav);letter-spacing:.04em}
.pill.pk{background:var(--pinkL);color:var(--pink)}
.sub{color:var(--sub);font-size:.9rem;font-weight:500}
.count{display:flex;align-items:baseline;gap:6px;font-family:var(--head)}
.count b{font-size:2.4rem;color:var(--pink);font-weight:400;font-variant-numeric:tabular-nums}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subj{text-align:left;display:flex;flex-direction:column;gap:6px;border-radius:24px;padding:14px;min-height:auto}
.subj .nm{font-family:var(--head);font-weight:400;font-size:1.25rem}
.bar{height:10px;border-radius:99px;background:var(--pinkL);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);border-radius:99px}
.subj:last-child:nth-child(odd){grid-column:1/-1}
label{font-size:.95rem}
input[type=text]{font:inherit;font-size:1.15rem;width:100%;padding:12px 16px;border-radius:16px;border:2.5px solid var(--line);background:var(--card);color:var(--ink)}
textarea{font:inherit;font-size:1.1rem;width:100%;padding:12px 16px;border-radius:16px;border:2.5px solid var(--line);background:var(--card);color:var(--ink);resize:vertical;line-height:1.6}
textarea:focus-visible{outline:3px solid var(--lav);outline-offset:3px}
textarea[readonly]{background:var(--bg)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.cmp{grid-template-columns:1fr}}
.shiki{white-space:pre-wrap;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:14px;padding:10px 12px;font-size:1.05rem;min-width:0}
.shiki.ex{background:var(--memo);border:2px dashed var(--memoLine)}
.film{display:flex;gap:6px;background:var(--ink);padding:8px 10px;border-radius:12px;overflow-x:auto}
.film span{flex:0 0 34px;height:34px;border-radius:6px;background:var(--gray);display:grid;place-items:center;color:#fff;font-size:1.1rem}
.film span.ok{background:var(--pink)}.film span.now{background:var(--lav)}
.qhead{display:flex;gap:12px;align-items:center}
.qhead svg{flex:0 0 64px}
.qtext{font-size:1.3rem;line-height:1.6;font-weight:800}
.choices{display:flex;flex-direction:column;gap:12px}
.choices .btn{text-align:left;border-radius:18px;font-size:1.1rem}
.choices .btn.ok{background:var(--okL);border-color:var(--ok);box-shadow:0 5px 0 var(--ok)}
.choices .btn.ng{background:var(--ngL);border-color:var(--ng);box-shadow:0 5px 0 var(--ng)}
.memo{background:var(--memo);border:2px dashed var(--memoLine);border-radius:18px;padding:12px 14px;font-weight:500}
.fb{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--okL)}.fb.ng{background:var(--ngL)}
.fb .big{font-family:var(--head);font-size:1.3rem}
.fb.ok .big{color:var(--ok)}.fb.ng .big{color:var(--ng)}
.kanji{font-size:1.6rem;letter-spacing:.1em}
.kanji .x{color:var(--ng);text-decoration:underline wavy;text-underline-offset:6px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.9);opacity:.4}100%{transform:scale(1);opacity:1}}
.fall{position:fixed;top:-30px;pointer-events:none;font-size:24px;animation:fall 1.5s ease-in forwards;z-index:9}
@keyframes fall{to{transform:translateY(105vh) rotate(260deg)}}
.sticker{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--pink);color:#fff;font-family:var(--head);font-size:2rem;
  padding:14px 28px;border-radius:999px;border:3px solid var(--btnEdge);box-shadow:0 6px 0 var(--btnEdge);z-index:10;animation:purun .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes purun{0%{transform:translate(-50%,-50%) scale(.3)}100%{transform:translate(-50%,-50%) scale(1)}}
.share{background:var(--lavL);border-radius:16px;padding:12px;white-space:pre-wrap;font-weight:500;user-select:all;overflow-wrap:anywhere}
.pic{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:center}
.pic svg{width:100%;max-width:340px;height:auto;display:block}
.pictag{align-self:flex-start;font-family:var(--head);font-size:.9rem;color:var(--pink)}
.piccap{font-size:.95rem;text-align:center}
.pic.pre svg{max-width:220px}
body.typing .top,body.typing .film,body.typing .qhead svg,body.typing .pic.pre{display:none}
body.typing .wrap{gap:10px}
body.typing #qc{padding:14px;gap:10px}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:3px solid var(--line);display:flex;flex-direction:column;gap:12px}
.tl li{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tl li::before{content:"";position:absolute;left:-28px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--line)}
.tl li.now{border-color:var(--pink);box-shadow:0 5px 0 var(--shadow)}
.tl li.now::before{background:var(--pink);border-color:var(--pink)}
.tl li.done{opacity:.55}
.tlwhen{font-size:.85rem;color:var(--sub);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tlttl{font-family:var(--head);font-size:1.1rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tld{font-weight:500;font-size:.95rem}
.tag{font-family:var(--body);font-size:.72rem;border-radius:99px;padding:1px 9px;font-weight:800}
.t-内申{background:var(--pink);color:#fff}.t-入試{background:var(--ngL);color:var(--ng)}.t-学校{background:var(--lavL);color:var(--lav)}.t-自分{background:var(--okL);color:var(--ok)}
.teachcard{border-top:2px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:99px;font-size:.9rem;z-index:11}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
const SUBJ={
  koku:{nm:"国語",col:"var(--pink)",prop:"brush"},
  math:{nm:"数学",col:"var(--lav)",prop:"ruler"},
  eng:{nm:"英語",col:"var(--pink)",prop:"abc"},
  sci:{nm:"理科",col:"var(--lav)",prop:"flask"},
  soc:{nm:"社会",col:"var(--pink)",prop:"globe"}
};
// c[0] が正解（表示時にシャッフル）。t:"in" は書いて答える問題
const Q=[
// ===== 国語 =====
{id:"K01",s:"koku",u:"漢字の書き",t:"in",a:"挑戦",q:["「ちょうせん」を漢字で書こう。","「新しい記録にちょうせんする」の「ちょうせん」を漢字で！","むずかしいことに立ち向かう「ちょうせん」。漢字で書くと？"],why:"「挑」はいどむ、「戦」はたたかう。",tip:"「挑」はてへん。「桃（きへん）」と書きまちがえないでね。",hint:"1字目は「てへん」の字だよ。"},
{id:"K02",s:"koku",u:"漢字の書き",t:"in",a:"複雑",q:["「ふくざつ」を漢字で書こう。","「ふくざつな気持ち」の「ふくざつ」を漢字で！","こみいっていること「ふくざつ」。漢字で書くと？"],why:"「複」はかさなる、「雑」はまじる。いろいろ重なってまじっている様子。",tip:"「複」はころもへん（衤）。しめすへん（礻）とまちがえやすいよ。",hint:"1字目は「ころもへん」の字だよ。"},
{id:"K03",s:"koku",u:"漢字の読み",c:["おだやか","なごやか","すこやか","ゆるやか"],q:["「穏やか」の読みは？","「穏やかな海」の「穏やか」はどう読む？","次の読みを選ぼう：「穏やか」"],why:"「穏やか」＝おだやか。しずかで落ち着いている様子。",tip:"「平穏（へいおん）」の「穏」。訓読みは「おだやか」。",hint:"しずかで落ち着いた様子を表す言葉だよ。"},
{id:"K04",s:"koku",u:"漢字の読み",c:["あわてる","あせる","あきれる","あばれる"],q:["「慌てる」の読みは？","「寝坊して慌てる」の「慌てる」はどう読む？","次の読みを選ぼう：「慌てる」"],why:"「慌てる」＝あわてる。急いで落ち着かない様子。",tip:"「大慌て（おおあわて）」で覚えよう。",hint:"急いで、落ち着かない様子だよ。"},
{id:"K05",s:"koku",u:"動詞の活用",tg:"テストによく出る",c:["五段活用","上一段活用","下一段活用","カ行変格活用"],q:["「書く」の活用の種類は？","動詞「書く」は何活用？","次の動詞の活用の種類を選ぼう：「書く」"],why:"「ない」をつけると「書かない」。「か」がア段の音なので五段活用。",tip:"「ない」をつけて、直前がア段→五段、イ段→上一段、エ段→下一段。",hint:"「ない」をつけてみよう。"},
{id:"K06",s:"koku",u:"動詞の活用",c:["上一段活用","五段活用","下一段活用","サ行変格活用"],q:["「起きる」の活用の種類は？","動詞「起きる」は何活用？","次の動詞の活用の種類を選ぼう：「起きる」"],why:"「起きない」。「き」がイ段の音なので上一段活用。",tip:"イ段＝上一段。「イ」は「ウ」より上だから「上」と覚えよう。",hint:"「ない」をつけて、直前の音を見よう。"},
{id:"K07",s:"koku",u:"活用形",c:["仮定形","命令形","連用形","未然形"],q:["「走れば間に合う」の「走れ」の活用形は？","「走れば」の「走れ」は何形？","次の活用形を選ぼう：「走れば」の「走れ」"],why:"「ば」に続く形は仮定形。",tip:"未然形→ない、連用形→ます、終止形→。、連体形→とき、仮定形→ば、命令形→！",hint:"あとに「ば」が続いているね。"},
{id:"K08",s:"koku",u:"敬語",tg:"テストによく出る",c:["伺う","いらっしゃる","おいでになる","行かれる"],q:["「先生のお宅に行く」。自分が行くときの正しい敬語は？","自分が先生の家に「行く」とき、ふさわしい言い方は？","「明日、先生のお宅に〇〇ます」。〇〇に入る謙譲語は？"],why:"自分の動作をへりくだるのは謙譲語。「行く」の謙譲語は「伺う・参る」。",tip:"主語が自分→謙譲語、主語が相手→尊敬語。",hint:"行くのは自分。自分をへりくだる言い方だよ。"},
{id:"K09",s:"koku",u:"敬語",c:["尊敬語","謙譲語","丁寧語","方言"],q:["「先生がおっしゃる」の「おっしゃる」は何語？","「おっしゃる」は敬語のどの種類？","「校長先生がおっしゃった」。この敬語の種類は？"],why:"「おっしゃる」は「言う」の尊敬語。相手（先生）の動作を高めている。",tip:"言う→おっしゃる（尊敬）／申す・申し上げる（謙譲）。",hint:"言っているのは先生だね。"},
{id:"K10",s:"koku",u:"熟語の構成",c:["強弱","岩石","読書","急増"],q:["「上下」と同じ組み立ての熟語は？","反対の意味の字を組み合わせた熟語を選ぼう。","「上下」のように、反対の意味の字を重ねた熟語は？"],why:"「上下」も「強弱」も、反対の意味の字を組み合わせている。",tip:"岩石＝似た意味、読書＝下が目的、急増＝上が下を修飾。",hint:"「強い」と「弱い」の関係は？"},
// ===== 数学 =====
{id:"M01",s:"math",u:"式の計算",c:["2a ＋ 6b","2a − 2b","4a ＋ 6b","2a ＋ 2b"],q:["3a ＋ 2b − (a − 4b) を計算しよう。","3a ＋ 2b − (a − 4b) ＝ ？","次の式を計算しよう：3a ＋ 2b − (a − 4b)"],why:"かっこをはずすと 3a＋2b−a＋4b。同類項をまとめて 2a＋6b。",tip:"かっこの前が「−」なら、中の符号を全部変える。",hint:"−(a − 4b) は −a ＋ 4b だよ。"},
{id:"M02",s:"math",u:"単項式の乗除",c:["2a","2ab","3a","2a²"],q:["6a²b ÷ 3ab を計算しよう。","6a²b ÷ 3ab ＝ ？","次の計算の答えは？ 6a²b ÷ 3ab"],why:"分数にして約分。6÷3＝2、a²÷a＝a、b÷b＝1。答えは 2a。",tip:"わり算は分数の形にして約分するとミスしにくい。",hint:"6a²b / 3ab と分数にしてみよう。"},
{id:"M03",s:"math",u:"単項式の乗除",tg:"テストによく出る",c:["12x³","−12x³","6x³","12x²"],q:["(−2x)² × 3x を計算しよう。","(−2x)² × 3x ＝ ？","次の計算の答えは？ (−2x)² × 3x"],why:"(−2x)²＝4x²。4x²×3x＝12x³。",tip:"2乗はかっこの中の数も文字も2回かける。マイナスも消える！",hint:"まず (−2x)² を計算しよう。"},
{id:"M04",s:"math",u:"等式の変形",c:["y ＝ 7 − 2x","y ＝ 7 ＋ 2x","y ＝ (7 − x) ÷ 2","y ＝ 2x − 7"],q:["2x ＋ y ＝ 7 を y について解くと？","等式 2x ＋ y ＝ 7 を「y ＝」の形にしよう。","2x ＋ y ＝ 7 を y について解いた式は？"],why:"2x を右辺に移項して y＝7−2x。",tip:"「〜について解く」＝その文字だけを左に残す。",hint:"2x を右辺に移項しよう。"},
{id:"M05",s:"math",u:"式の値",t:"in",a:"−7",q:["a＝3, b＝−2 のとき、2(a＋b) − (a−3b) の値は？","a＝3、b＝−2 を 2(a＋b) − (a−3b) に代入した値は？","2(a＋b) − (a−3b) の値を求めよう（a＝3, b＝−2）。"],why:"先に式を簡単にすると a＋5b。3＋5×(−2)＝3−10＝−7。",tip:"代入の前に、式をできるだけ簡単にすると楽！",hint:"まず 2(a＋b) − (a−3b) を整理しよう。"},
{id:"M06",s:"math",u:"連立方程式",c:["x＝4, y＝3","x＝3, y＝4","x＝5, y＝2","x＝6, y＝1"],q:["x ＋ y ＝ 7、x − y ＝ 1 を解こう。","連立方程式 x＋y＝7、x−y＝1 の解は？","次の連立方程式を解こう：x＋y＝7、x−y＝1"],why:"2式をたすと 2x＝8 で x＝4。x＋y＝7 に入れて y＝3。",tip:"y の符号がちがうときは、たすと y が消える（加減法）。",hint:"2つの式をたしてみよう。"},
{id:"M07",s:"math",u:"連立方程式",c:["x＝3, y＝6","x＝6, y＝3","x＝5, y＝10","x＝2, y＝4"],q:["y ＝ 2x、3x ＋ y ＝ 15 を解こう。","連立方程式 y＝2x、3x＋y＝15 の解は？","次の連立方程式を解こう：y＝2x、3x＋y＝15"],why:"y＝2x を代入して 3x＋2x＝15、x＝3。y＝2×3＝6。",tip:"「y＝」の式があったら代入法が早い。",hint:"y のところに 2x を入れよう。"},
{id:"M08",s:"math",u:"連立方程式の利用",tg:"テストによく出る",c:["あめ6個、ガム4個","あめ4個、ガム6個","あめ5個、ガム5個","あめ7個、ガム3個"],q:["1個50円のあめと1個80円のガムを合わせて10個買ったら620円。それぞれ何個？","あめ（50円）とガム（80円）を合計10個、620円分買った。個数は？","50円のあめと80円のガムを全部で10個買い、代金は620円。あめとガムは何個ずつ？"],why:"あめ x 個、ガム y 個として x＋y＝10、50x＋80y＝620。解くと x＝6、y＝4。",tip:"「個数の式」と「代金の式」の2本をつくる。",hint:"x＋y＝10 と 50x＋80y＝620 の2つの式だよ。"},
{id:"M09",s:"math",u:"1次関数",c:["傾き 2、切片 −3","傾き −3、切片 2","傾き 2、切片 3","傾き 3、切片 −2"],q:["y ＝ 2x − 3 の傾きと切片は？","1次関数 y＝2x−3 のグラフの傾きと切片を選ぼう。","y ＝ 2x − 3 について、正しい組み合わせは？"],why:"y＝ax＋b の a が傾き、b が切片。a＝2、b＝−3。",tip:"x についている数＝傾き、ついていない数＝切片。",hint:"y＝ax＋b の形とくらべよう。"},
{id:"M10",s:"math",u:"1次関数の式",c:["y ＝ 2x ＋ 1","y ＝ 2x ＋ 3","y ＝ 4x − 1","y ＝ x ＋ 2"],q:["2点 (1, 3)、(3, 7) を通る直線の式は？","点(1, 3)と点(3, 7)を通る1次関数の式を選ぼう。","(1, 3)、(3, 7) を通る直線を表す式は？"],why:"傾き＝(7−3)÷(3−1)＝2。y＝2x＋b に (1, 3) を入れて b＝1。",tip:"傾きを先に出してから、1点を代入して切片を求める。",hint:"まず傾きを求めよう。"},
// ===== 英語 =====
{id:"E01",s:"eng",u:"過去進行形",c:["was","were","am","did"],q:["I ( ) watching TV then.","( )に入る語は？ I ( ) watching TV then.","「私はそのときテレビを見ていました」I ( ) watching TV then."],why:"過去進行形は was / were ＋ 〜ing。主語が I なので was。",tip:"I / he / she → was、you / we / they → were。",hint:"then（そのとき）は過去だね。"},
{id:"E02",s:"eng",u:"be going to",c:["going","go","will","went"],q:["I'm ( ) to visit Kyoto next week.","( )に入る語は？ I'm ( ) to visit Kyoto next week.","「来週、京都を訪れる予定です」I'm ( ) to visit Kyoto next week."],why:"be going to ＋ 動詞の原形 で「〜する予定だ」。",tip:"予定は be going to、その場で決めたことは will が多い。",hint:"be ○○ to の形を思い出そう。"},
{id:"E03",s:"eng",u:"will",c:["will","is","does","was"],q:["It ( ) rain tomorrow.","( )に入る語は？ It ( ) rain tomorrow.","「明日は雨が降るでしょう」It ( ) rain tomorrow."],why:"未来のことは will ＋ 動詞の原形。",tip:"will のあとは必ず原形。",hint:"tomorrow は未来だね。"},
{id:"E04",s:"eng",u:"接続詞 when",c:["When","If","Because","Than"],q:["( ) I got home, my mother was cooking.","( )に入る語は？ ( ) I got home, my mother was cooking.","「私が家に着いたとき、母は料理をしていました」( ) I got home, ..."],why:"「〜するとき」は接続詞 when。",tip:"when＝とき、if＝もし、because＝なぜなら。",hint:"「家に着いた『とき』」だね。"},
{id:"E05",s:"eng",u:"接続詞 because",c:["because","but","so","or"],q:["I stayed home ( ) I was sick.","( )に入る語は？ I stayed home ( ) I was sick.","「具合が悪かったので家にいました」I stayed home ( ) I was sick."],why:"理由を表す「〜なので」は because。",tip:"because のあとに理由、so のあとに結果。",hint:"家にいた理由をつなげているよ。"},
{id:"E06",s:"eng",u:"不定詞（名詞的用法）",tg:"テストによく出る",c:["to be","be","being","am"],q:["I want ( ) a doctor.","( )に入る語は？ I want ( ) a doctor.","「私は医者になりたい」I want ( ) a doctor."],why:"want to ＋ 動詞の原形 で「〜したい」。be の原形を使って to be。",tip:"want to 〜＝〜したい。to のあとは原形。",hint:"want のあとに「to ＋原形」が来るよ。"},
{id:"E07",s:"eng",u:"不定詞（副詞的用法）",c:["to","for","in","at"],q:["I went to the library ( ) study.","( )に入る語は？ I went to the library ( ) study.","「勉強するために図書館へ行きました」I went to the library ( ) study."],why:"「〜するために」は to ＋ 動詞の原形。",tip:"目的を表す to。Why? と聞かれて答えるときにも使う。",hint:"study は動詞。動詞の前に置くのは？"},
{id:"E08",s:"eng",u:"There is / are",c:["are","is","be","am"],q:["There ( ) two cats under the table.","( )に入る語は？ There ( ) two cats under the table.","「テーブルの下にねこが2匹います」There ( ) two cats under the table."],why:"There is / are のあとの名詞が複数（two cats）なので are。",tip:"後ろが1つなら is、2つ以上なら are。",hint:"cats は1匹？それとも複数？"},
{id:"E09",s:"eng",u:"接続詞 that",c:["that","what","when","who"],q:["I think ( ) he is kind.","( )に入る語は？ I think ( ) he is kind.","「彼は親切だと思います」I think ( ) he is kind."],why:"「〜だと思う」は I think that 〜。that は省略することもある。",tip:"think / know / hope のあとの that は「〜ということ」。",hint:"「〜ということ」をつなぐ語だよ。"},
{id:"E10",s:"eng",u:"不規則動詞",c:["went","goed","gone","going"],q:["go の過去形は？","「行った」は英語で？ go の過去形を選ぼう。","I ( ) to the park yesterday. に入る go の形は？"],why:"go の過去形は went。ed をつけない不規則動詞。",tip:"go-went-gone。セットで声に出して覚えよう。",hint:"ed はつかないよ。"},
// ===== 理科 =====
{id:"S01",s:"sci",u:"分解",c:["二酸化炭素","酸素","水素","アンモニア"],q:["炭酸水素ナトリウムを加熱して出た気体を石灰水に通すと白くにごった。気体は？","炭酸水素ナトリウムの熱分解で発生する気体は？","加熱で出た気体が石灰水を白くにごらせた。何の気体？"],why:"炭酸水素ナトリウムは分解して、炭酸ナトリウム・水・二酸化炭素になる。石灰水を白くにごらせるのは二酸化炭素。",tip:"石灰水が白くにごる＝二酸化炭素。",hint:"石灰水を白くにごらせる気体だよ。"},
{id:"S02",s:"sci",u:"水の電気分解",tg:"テストによく出る",c:["水素","酸素","二酸化炭素","塩素"],q:["水の電気分解で、陰極に発生する気体は？","水を電気分解したとき、陰極側に集まる気体は？","水の電気分解。陰極から出た気体にマッチの火を近づけると音を立てて燃えた。気体は？"],why:"陰極に水素、陽極に酸素ができる。体積は水素：酸素＝2：1。",tip:"陰極（−）に水素。「インスイ（陰・水）」で覚えよう。",hint:"体積が多いほうの気体だよ。"},
{id:"S03",s:"sci",u:"化学式",c:["H₂O","HO₂","H₂O₂","OH"],q:["水の化学式は？","水を化学式で表すと？","水分子を表す化学式を選ぼう。"],why:"水分子は水素原子2個と酸素原子1個でできている。H₂O。",tip:"原子の数は右下に小さく書く。1は書かない。",hint:"水素（H）が2個、酸素（O）が1個。"},
{id:"S04",s:"sci",u:"化合",c:["硫化鉄","酸化鉄","硫酸","鉄と硫黄のまま"],q:["鉄と硫黄の混合物を加熱すると、何ができる？","鉄粉と硫黄を加熱したときにできる物質は？","Fe ＋ S → ？ できる物質を選ぼう。"],why:"鉄と硫黄が結びついて硫化鉄（FeS）ができる。磁石につかない別の物質になる。",tip:"〇〇と硫黄→硫化〇〇。〇〇と酸素→酸化〇〇。",hint:"硫黄と結びついた物質の名前は「硫化〜」。"},
{id:"S05",s:"sci",u:"酸化と還元",c:["還元","酸化","分解","燃焼"],q:["酸化銅と炭素を加熱すると銅ができる。酸化銅に起きた化学変化は？","酸化物から酸素がうばわれる化学変化を何という？","酸化銅が銅にもどる変化の名前は？"],why:"酸素がうばわれるのが還元。このとき炭素は酸化されて二酸化炭素になる。",tip:"酸素とくっつく＝酸化、酸素がはなれる＝還元。同時に起きる！",hint:"酸素が「はなれる」変化だよ。"},
{id:"S06",s:"sci",u:"質量の変化",t:"in",a:"0.2",unit:"g",q:["銅0.8gを完全に酸化させたら酸化銅が1.0gできた。結びついた酸素は何g？（数字で）","0.8gの銅が1.0gの酸化銅になった。酸素は何g結びついた？","銅0.8g → 酸化銅1.0g。結びついた酸素の質量は？"],why:"増えた分が酸素。1.0−0.8＝0.2g。銅：酸素＝4：1。",tip:"結びついた酸素＝酸化後の質量−もとの質量。",hint:"増えた質量は何の分？"},
{id:"S07",s:"sci",u:"細胞のつくり",c:["細胞壁","核","細胞膜","細胞質"],q:["植物の細胞にだけあって、動物の細胞にないものは？","植物細胞と動物細胞をくらべたとき、植物細胞だけにあるのは？","植物の体を支える、植物細胞だけのつくりは？"],why:"細胞壁は植物細胞だけにあり、体を支える。葉緑体・液胞も植物細胞の特徴。",tip:"植物だけ：細胞壁・葉緑体・液胞。両方：核・細胞膜。",hint:"細胞のいちばん外側にある、じょうぶなつくりだよ。"},
{id:"S08",s:"sci",u:"光合成",c:["酸素","二酸化炭素","窒素","水素"],q:["光合成でデンプンといっしょにできる気体は？","植物が光合成をすると出てくる気体は？","光合成で、葉から出ていく気体を選ぼう。"],why:"光合成は水と二酸化炭素から、光のエネルギーでデンプンと酸素をつくる。",tip:"入る：水・二酸化炭素、出る：デンプン・酸素。",hint:"わたしたちが呼吸で使う気体だよ。"},
{id:"S09",s:"sci",u:"蒸散",c:["蒸散","光合成","呼吸","吸収"],q:["植物の体から、水が水蒸気になって出ていくことを何という？","気孔から水蒸気が出ていくはたらきは？","葉の気孔から水が水蒸気として出ていく現象の名前は？"],why:"蒸散は主に葉の気孔で起こり、根から水を吸い上げる力にもなる。",tip:"蒸（むして）散（ちらす）＝水蒸気を出す。",hint:"「蒸」の字が入るよ。"},
{id:"S10",s:"sci",u:"単細胞生物",c:["ゾウリムシ","ミジンコ","メダカ","オオカナダモ"],q:["体が1つの細胞でできている生物は？","単細胞生物はどれ？","1つの細胞だけで生きている生物を選ぼう。"],why:"ゾウリムシやミカヅキモは単細胞生物。ミジンコは多くの細胞でできた多細胞生物。",tip:"単細胞生物の例：ゾウリムシ・アメーバ・ミカヅキモ。",hint:"顕微鏡で見る、ぞうりの形をした生物だよ。"},
// ===== 社会 =====
{id:"H01",s:"soc",u:"日本の気候",c:["北西の季節風が日本海で水分をふくみ、山地にぶつかるから","南東の季節風が太平洋から吹くから","梅雨前線が長くとどまるから","台風が多く通るから"],q:["日本海側で冬に雪が多い理由は？","冬、日本海側の地域に雪が多く降るのはなぜ？","日本海側の冬の降水（雪）が多い理由として正しいものは？"],why:"冬の北西の季節風が日本海で水蒸気をふくみ、山地にぶつかって雪を降らせる。",tip:"冬は北西から、夏は南東から季節風。",hint:"冬の季節風はどの方角から吹く？"},
{id:"H02",s:"soc",u:"九州地方",c:["シラス台地","関東ローム","カルスト台地","扇状地"],q:["鹿児島県など九州南部に広がる、火山の噴出物でできた台地は？","九州南部の、水もちが悪い火山灰の台地を何という？","畜産やさつまいもの栽培がさかんな九州南部の台地は？"],why:"シラス台地は火山の噴出物が積もってできた。水もちが悪いので畜産や畑作が中心。",tip:"シラス＝白い砂。九州南部、桜島の近く。",hint:"カタカナ3文字の名前がつく台地だよ。"},
{id:"H03",s:"soc",u:"中国・四国地方",c:["夏も冬も、山地が季節風をさえぎるから","一年中、台風が通るから","海流の影響で気温が低いから","雪どけ水が少ないから"],q:["瀬戸内の地域が一年を通して雨が少ない理由は？","瀬戸内の気候で降水量が少ないのはなぜ？","瀬戸内海の沿岸で雨が少ない理由を選ぼう。"],why:"夏の季節風は四国山地に、冬の季節風は中国山地にさえぎられるから。",tip:"2つの山地にはさまれている＝雨が少ない。ため池が多い理由にもなる。",hint:"北と南にある山地に注目しよう。"},
{id:"H04",s:"soc",u:"中部地方",c:["ぶどう・もも","米","茶","みかん"],q:["甲府盆地の扇状地でさかんに栽培されている作物は？","山梨県の甲府盆地で多くつくられているくだものは？","水はけのよい扇状地を利用した、甲府盆地の果樹栽培は？"],why:"扇状地は水はけがよく果樹に向いている。甲府盆地はぶどう・ももの産地。",tip:"扇状地＝水はけがよい＝果樹園。",hint:"くだものの組み合わせだよ。"},
{id:"H05",s:"soc",u:"関東地方",c:["京浜工業地帯","中京工業地帯","阪神工業地帯","北九州工業地帯"],q:["東京から神奈川県の臨海部に広がる工業地帯は？","横浜や川崎の海沿いにある工業地帯の名前は？","東京・川崎・横浜にまたがる工業地帯を選ぼう。"],why:"京浜工業地帯は東京・神奈川の臨海部に広がる。「京」は東京、「浜」は横浜。",tip:"京浜＝東京＋横浜、中京＝名古屋中心、阪神＝大阪＋神戸。",hint:"名前に「浜」が入るよ。"},
{id:"H06",s:"soc",u:"鎌倉時代",c:["六波羅探題","京都所司代","大宰府","鎌倉府"],q:["承久の乱のあと、鎌倉幕府が朝廷を見張るため京都に置いたのは？","承久の乱後に京都に置かれた、鎌倉幕府の機関は？","朝廷の監視と西日本の御家人の統制のために置かれたものは？"],why:"承久の乱（1221年）のあと、幕府は京都に六波羅探題を置いて朝廷を見張った。",tip:"京都所司代は江戸時代。時代をまちがえないでね。",hint:"鎌倉時代に京都の「六波羅」に置かれたよ。"},
{id:"H07",s:"soc",u:"室町時代",tg:"テストによく出る",c:["勘合貿易","南蛮貿易","朱印船貿易","日宋貿易"],q:["足利義満が始めた、明との貿易を何という？","倭寇と区別するため合い札を使った明との貿易は？","室町時代、勘合という証明書を使って行った貿易は？"],why:"正式な貿易船であることを証明するため、勘合という合い札を使った。",tip:"日宋＝平清盛、勘合＝足利義満、朱印船＝江戸初期。",hint:"合い札の名前がそのまま貿易の名前だよ。"},
{id:"H08",s:"soc",u:"戦国時代",c:["種子島","長崎","平戸","堺"],q:["1543年、ポルトガル人が鉄砲を伝えた場所は？","鉄砲が日本に伝わった島は？","1543年に鉄砲が伝来した場所を選ぼう。"],why:"1543年、種子島（鹿児島県）に流れ着いたポルトガル人が鉄砲を伝えた。",tip:"「以後よさん（1543）ざん 鉄砲伝来」。",hint:"鹿児島県にある島だよ。"},
{id:"H09",s:"soc",u:"安土桃山時代",c:["刀狩","太閤検地","楽市・楽座","参勤交代"],q:["豊臣秀吉が、百姓から刀や鉄砲を取り上げた政策は？","一揆を防ぐため、百姓の武器を取り上げた政策を何という？","兵農分離を進めた、豊臣秀吉の武器回収の政策は？"],why:"刀狩で百姓は武器を持てなくなり、武士と百姓の身分の区別（兵農分離）が進んだ。",tip:"太閤検地＝土地の調査、刀狩＝武器の取り上げ。",hint:"名前に「刀」が入るよ。"},
{id:"H10",s:"soc",u:"江戸時代",c:["出島","種子島","対馬","平戸"],q:["鎖国の時代、オランダと貿易をした長崎の人工の島は？","江戸時代、オランダ商館が置かれた長崎の島は？","長崎につくられた扇形の人工島を選ぼう。"],why:"鎖国中もオランダとは長崎の出島で貿易を続けた。",tip:"長崎＝出島（オランダ）と唐人屋敷（中国）。",hint:"扇の形をした人工の島だよ。"}
];

// ===== 計算問題：式を書いてから答えを見る（式の例） =====
const STEPS={
  M01:"3a ＋ 2b − (a − 4b)\n＝ 3a ＋ 2b − a ＋ 4b\n＝ 2a ＋ 6b",

// ---- 出題 ----
let R=null;
function start(s,cat=""){
  const ids=catIds(s,cat);
  const pool=Q.filter(q=>ids.includes(q.id)&&!P(q.id).g);
  if(!pool.length){allDone(s,cat);return}
  const ord=shuf(pool).sort((a,b)=>(P(b.id).w-P(a.id).w)||(P(a.id).seen-P(b.id).seen));
  R={s,cat,queue:ord.slice(0,5).map(q=>q.id),i:0,log:[],first:{},retried:new Set(),hint:false,grads:[]};
  ask();
}
function ask(){
  const id=R.queue[R.i],q=Q.find(x=>x.id===id),p=P(id);R.hint=false;
  const film=R.queue.map((_,k)=>`<span class="${k<R.log.length?(R.log[k]?"ok":""):(k===R.i?"now":"")}">${k<R.log.length?(R.log[k]?"♡":"・"):""}</span>`).join("");
  const body=STEPS[id]
    ?`<label for="shiki">式を書いてね（答えまで書こう）</label><textarea id="shiki" rows="4" placeholder="例：6 ÷ 2 ＝ …"></textarea><button class="btn main" id="reveal">答えを見る</button><div id="rv"></div>`
    :q.t==="in"
    ?`<input type="text" id="ans" autocomplete="off" placeholder="ここに書こう"><button class="btn main" id="go">こたえる</button>`
    :`<div class="choices">${shuf(q.c).map(c=>`<button class="btn ch">${esc(c)}</button>`).join("")}</div>`;
  app.innerHTML=`${topbar(true)}
  <div class="film" aria-label="きょうのログ">${film}</div>
  <div class="card pop" id="qc">
    <div class="row" style="gap:6px"><span class="pill">${SUBJ[q.s].nm}・${esc(catOf(q.id))}</span><span class="pill">${esc(q.u)}</span>${q.tg?`<span class="pill pk">${q.tg}</span>`:""}</div>
    <div class="qhead">${mascot(SUBJ[q.s].prop)}<div class="qtext">${esc(pick(q.q))}</div></div>
    ${PIC[id]&&PIC[id].pre?`<div class="pic pre">${picSVG(id)}</div>`:""}
    ${body}
    <button class="btn small" id="hintBtn">ヒントを見る</button>
    <div class="memo" id="hint" hidden></div>
  </div><div id="fb"></div>`;
  bindTop();
  document.body.classList.remove("typing");
  app.querySelectorAll("#ans,#shiki").forEach(el=>{
    el.addEventListener("focus",()=>{document.body.classList.add("typing");setTimeout(()=>{const t=document.querySelector("#qc");t&&t.scrollIntoView({block:"start",behavior:reduce?"auto":"smooth"})},350)});
    el.addEventListener("blur",()=>setTimeout(()=>{const ae=document.activeElement;if(!ae||(ae.id!=="ans"&&ae.id!=="shiki"))document.body.classList.remove("typing")},300));
  });
  document.getElementById("hintBtn").onclick=()=>{R.hint=true;const h=document.getElementById("hint");h.hidden=false;h.textContent="ヒント："+q.hint};
  if(STEPS[id]){
    const ta=document.getElementById("shiki"),rb=document.getElementById("reveal");
    rb.onclick=()=>{const v=ta.value.trim();if(!v){toast("先に式を書いてね");ta.focus();return}
      ta.readOnly=true;rb.hidden=true;document.getElementById("hintBtn").hidden=true;
      const rv=document.getElementById("rv");
      rv.innerHTML=`<div class="cmp"><div><div class="sub">あなたの式</div><div class="shiki">${esc(v)}</div></div>
        <div><div class="sub">式の例</div><div class="shiki ex">${esc(STEPS[id])}</div></div></div>
        <div class="fb ok" style="background:var(--lavL)"><div>答え：<b class="big" style="color:var(--lav)">${esc(ansText(q))}</b></div></div>
        <div class="sub">自分の答えとくらべてみよう</div>
        <div class="row"><button class="btn main" id="selfOk">あってた♡</button><button class="btn" id="selfNg">ちがった</button></div>`;
      const fin=ok=>{document.getElementById("selfOk").disabled=true;document.getElementById("selfNg").disabled=true;judge(q,ok)};
      document.getElementById("selfOk").onclick=()=>fin(true);
      document.getElementById("selfNg").onclick=()=>fin(false);
    };
  }
  else if(q.t==="in"){const a=document.getElementById("ans");
    const go=()=>{const v=norm(a.value);if(!v)return;judge(q,v===norm(q.a),v)};
    document.getElementById("go").onclick=go;a.onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing)go()}}
  else app.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{
    app.querySelectorAll(".ch").forEach(x=>{x.disabled=true;if(x.textContent===q.c[0])x.classList.add("ok")});
    if(b.textContent!==q.c[0])b.classList.add("ng");judge(q,b.textContent===q.c[0])});
}
function norm(s){return s.replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-65248)).replace(/[\s　]/g,"").replace(/(cm|Ａ|A|J|Ｊ|倍|本|時間)$/i,"")}
function kanjiMark(user,ans){return [...user].map((c,i)=>c===ans[i]?esc(c):`<span class="x">${esc(c)}</span>`).join("")}
function judge(q,ok,typed){
  document.body.classList.remove("typing");
  const p=P(q.id);p.seen++;
  if(R.first[q.id]===undefined)R.first[q.id]=ok;
  let grad=false;
  if(ok){if(!R.hint){p.st++;if(p.st>=2&&!p.g){p.g=true;grad=true;R.grads.push(q.id)}}p.w=false}
  else{p.st=0;p.w=true;if(!R.retried.has(q.id)){R.retried.add(q.id);R.queue.splice(Math.min(R.i+3,R.queue.length),0,q.id)}}
  R.log.push(ok);save();
  const ae=document.getElementById("ans");if(ae){ae.disabled=true;document.getElementById("go").disabled=true}
  document.getElementById("hintBtn").hidden=true;
  const isK=q.s==="koku";
  const fb=document.getElementById("fb");
  fb.innerHTML=`<div class="card"><div class="fb ${ok?"ok":"ng"} pop">
    <div class="big">${ok?(grad?"卒業！おめでとう":"せいかい！"):"おしい！ここを覚えればOK"}</div>
    ${!ok&&typed!==undefined&&isK?`<div>あなたの答え：<span class="kanji">${kanjiMark(typed,q.a)}</span></div>`:""}
    <div>正解：<b>${esc(ansText(q))}</b></div>
    <div>${esc(q.why)}</div></div>
    ${PIC[q.id]?`<div class="pic"><div class="pictag">絵で覚えよう</div>${picSVG(q.id)}<div class="piccap">${esc(PIC[q.id].cap)}</div></div>`:""}
    <div class="memo"><b>覚え方</b>　${esc(q.tip)}${q.chk?"<br><span class=\"sub\">言葉の使い方は教科書によってちがうことがあるよ。先生に確認してね。</span>":""}</div>
    <button class="btn main" id="next">${R.i+1<R.queue.length?"つぎへ":"結果を見る"}</button></div>`;
  if(ok)snd(grad?"grad":"ok");
  if(grad)celebrate();
  document.getElementById("next").onclick=()=>{R.i++;R.i<R.queue.length?ask():result()};
  if(!reduce)fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function celebrate(){
  if(reduce){toast("卒業！");return}
  for(let i=0;i<18;i++){const s=document.createElement("span");s.className="fall";s.textContent=pick(["♡","★","✿"]);
    s.style.left=Math.random()*100+"vw";s.style.color=pick(["var(--pink)","var(--lav)","var(--memoLine)"]);s.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2000)}
  const st=document.createElement("div");st.className="sticker";st.textContent="卒業！";document.body.appendChild(st);setTimeout(()=>st.remove(),1500);
}

    <div class="sub">2028年2月の神奈川県公立高校入試に向けた流れだよ。</div></div>
  <ol class="tl">${SCHED.map((x,i)=>{const st=i===ni?"now":(ym(x.e)<k?"done":"");
    return `<li class="${st}"><div class="tlwhen">${x.when}${i===ni?'<span class="pill pk">いまここ</span>':""}</div>
      <div class="tlttl">${x.ttl}　${x.tags.map(t=>`<span class="tag t-${t}">${t}</span>`).join("")}</div>
      <div class="tld">${x.d}</div></li>`}).join("")}</ol>
  <div class="memo">2027年以降の日程は、これまでの例年をもとにした目安だよ。正式な日程は神奈川県の発表と学校の先生に確認してね。内申に入る学期も、学校の学期制によってちがうことがあるよ。</div>
  <button class="btn main" id="toNote">5教科ノートで勉強する</button>`;
  bindTop();
  document.getElementById("toNote").onclick=home;
}

// ---- 教え合い ----
function teach(val){
  app.innerHTML=`${topbar(true)}<div class="card">
    <h2>教え合いモード</h2>
    <label for="codes">友達から届いた番号（スペース区切り）</label>
    <input type="text" id="codes" placeholder="例：M02 H05" value="${esc(val)}">
    <button class="btn main" id="show">答えと理由を見る</button>
    <div id="tout"></div></div>`;
  bindTop();
  const run=()=>{
    const codes=(document.getElementById("codes").value.toUpperCase().match(/[KMESH]\d{2}/g)||[]);
    const out=codes.map(c=>Q.find(q=>q.id===c)).filter(Boolean);
    document.getElementById("tout").innerHTML=out.length?out.map(q=>`<div class="teachcard">
      <span class="pill">${q.id}・${SUBJ[q.s].nm}・${esc(catOf(q.id))}</span>
      <div><b>${esc(q.q[0])}</b></div>
      <div>正解：<b>${esc(ansText(q))}</b></div>
      ${STEPS[q.id]?`<div class="shiki ex">${esc(STEPS[q.id])}</div>`:""}
      <div>${esc(q.why)}</div>
      ${PIC[q.id]?`<div class="pic">${picSVG(q.id)}<div class="piccap">${esc(PIC[q.id].cap)}</div></div>`:""}
      <div class="memo"><b>覚え方</b>　${esc(q.tip)}</div></div>`).join("")
      :`<div class="sub">番号が見つからなかったよ。M02 のように「英字1つ＋数字2つ」で入れてね。</div>`;
  };
  document.getElementById("show").onclick=run;
  if(val)run();
}
home();
</script>
